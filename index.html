<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dfede8"><meta name="description" content="Stutt öndunarstund fyrir skóladaginn. Kassaöndun og jöfn öndun í 1–5 mínútur.">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Öndun">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css">
<title>Öndun · Stund fyrir þig</title>
</head>
<body>
<section id="selection-screen" aria-label="Velja æfingu">
<header><a class="brand" href="./" aria-label="Öndun, upphaf"><span aria-hidden="true">◌</span> Öndun</a><button id="install" class="quiet">Setja upp app</button></header>
<main class="selection">
<h1>Öndun</h1>
<form id="choices">
<fieldset><legend>Veldu öndun</legend><div class="segmented"><button type="button" data-mode="box" aria-pressed="true">□ &nbsp; Kassaöndun</button><button type="button" data-mode="equal" aria-pressed="false">○ &nbsp; Jöfn öndun</button></div></fieldset>
<fieldset><legend>Hversu lengi?</legend><div class="minutes"><button type="button" data-minutes="1" aria-pressed="true">1 mín</button><button type="button" data-minutes="2" aria-pressed="false">2 mín</button><button type="button" data-minutes="3" aria-pressed="false">3 mín</button><button type="button" data-minutes="4" aria-pressed="false">4 mín</button><button type="button" data-minutes="5" aria-pressed="false">5 mín</button></div></fieldset>
<label class="sound-choice"><input id="sound" type="checkbox" checked> Hljóðmerki</label>
<button type="submit" class="primary">Áfram</button>
</form>
</main>
</section>
<main id="exercise-screen" class="exercise" aria-label="Öndunaræfing" hidden>
<div class="visual" id="visual">
<div id="box-visual" class="box-visual" aria-hidden="true"><svg viewBox="0 0 320 320"><rect x="28" y="28" width="264" height="264" class="track"/><path id="trail" d="M28 28 H292 V292 H28 Z" pathLength="1"/><circle id="dot" cx="28" cy="28" r="8"/></svg></div>
<div id="balloon-visual" class="balloon-visual" aria-hidden="true" hidden><div class="balloon" id="balloon"><span class="shine"></span><span class="knot"></span><svg class="string" viewBox="0 0 40 75"><path d="M20 0 C0 25 40 40 20 75"/></svg></div></div>
<p id="phase" role="status" aria-live="polite" tabindex="-1"></p>
</div>
<button id="action" class="corner-button">Byrja</button>
</main>
<dialog id="install-help"><h2>Öndun sem app</h2><p id="install-message">Opnaðu valmynd Chrome eða Edge og veldu að setja Öndun upp sem app. Í iPhone eða iPad: opnaðu í Safari, ýttu á Deila og veldu „Bæta á heimaskjá“.</p><p>Eftir fyrstu opnun og vistun virkar æfingin líka án nets.</p><button id="close-help" class="primary">Loka</button></dialog>
<script type="module" src="./app.js"></script>
</body></html>
